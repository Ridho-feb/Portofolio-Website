<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <!-- Container Background & Outer Border -->
  <rect x="10" y="10" width="780" height="540" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  
  <!-- Inner Border Frame -->
  <rect x="30" y="30" width="740" height="500" rx="12" fill="none" stroke="#21262D" stroke-width="2" stroke-dasharray="8,8"/>

  <!-- Header Bar -->
  <path d="M 30 42 C 30 35.37 35.37 30 42 30 L 758 30 C 764.63 30 770 35.37 770 42 L 770 100 L 30 100 Z" fill="#161B22"/>
  <line x1="30" y1="100" x2="770" y2="100" stroke="#30363D" stroke-width="2"/>

  <!-- BNSP Emblem / Title -->
  <g transform="translate(60, 65)">
    <rect x="0" y="-20" width="40" height="40" rx="8" fill="#1F6FEB" opacity="0.2"/>
    <rect x="0" y="-20" width="40" height="40" rx="8" fill="none" stroke="#58A6FF" stroke-width="2"/>
    <circle cx="12" cy="0" r="3" fill="#58A6FF"/>
    <circle cx="28" cy="0" r="3" fill="#58A6FF"/>
    <circle cx="20" cy="-10" r="3" fill="#58A6FF"/>
    <line x1="12" y1="0" x2="20" y2="-10" stroke="#58A6FF" stroke-width="1.5"/>
    <line x1="28" y1="0" x2="20" y2="-10" stroke="#58A6FF" stroke-width="1.5"/>
    <line x1="12" y1="0" x2="28" y2="0" stroke="#58A6FF" stroke-width="1.5"/>

    <text x="56" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#F0F6FC" letter-spacing="1">
      BNSP CERTIFICATION
    </text>
  </g>

  <!-- Competency Passed Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#238636" opacity="0.2" stroke="#238636" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="8" fill="#238636"/>
    <path d="M 16 16 L 19 19 L 24 13" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3FB950">
      PASSED &amp; CERTIFIED
    </text>
  </g>

  <!-- Document Outline & Illustration -->
  <g transform="translate(260, 140)">
    <rect x="0" y="0" width="280" height="220" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    
    <!-- Watermark Lines -->
    <line x1="30" y1="40" x2="180" y2="40" stroke="#30363D" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="60" x2="250" y2="60" stroke="#21262D" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="75" x2="220" y2="75" stroke="#21262D" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="90" x2="200" y2="90" stroke="#21262D" stroke-width="2" stroke-linecap="round"/>

    <!-- Network Server Graphic -->
    <g transform="translate(30, 115)">
      <rect x="0" y="0" width="220" height="60" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="4" fill="#238636"/>
      <circle cx="36" cy="20" r="4" fill="#58A6FF"/>
      <circle cx="52" cy="20" r="4" fill="#58A6FF"/>
      <line x1="80" y1="20" x2="200" y2="20" stroke="#21262D" stroke-width="2" stroke-linecap="round"/>
      
      <circle cx="20" cy="40" r="4" fill="#238636"/>
      <circle cx="36" cy="40" r="4" fill="#58A6FF"/>
      <circle cx="52" cy="40" r="4" fill="#8B949E"/>
      <line x1="80" y1="40" x2="200" y2="40" stroke="#21262D" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Certificate Seal Accent -->
    <circle cx="220" cy="40" r="18" fill="#1F6FEB" opacity="0.15" stroke="#58A6FF" stroke-width="1.5"/>
    <polygon points="220,28 223,35 231,35 224,40 227,47 220,42 213,47 216,40 209,35 217,35" fill="#58A6FF"/>
  </g>

  <!-- Title & Description Text -->
  <g transform="translate(400, 395)" text-anchor="middle">
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#F0F6FC">
      Computer Network Engineer
    </text>
    
    <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#58A6FF">
      Badan Nasional Sertifikasi Profesi (BNSP)
    </text>

    <!-- Status Banner Box -->
    <g transform="translate(-180, 45)">
      <rect x="0" y="0" width="360" height="42" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
      <circle cx="30" cy="21" r="10" fill="none" stroke="#8B949E" stroke-width="1.5"/>
      <polyline points="30,15 30,21 34,23" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round"/>
      
      <text x="50" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8B949E">
        Physical Certificate Pending Issuance
      </text>
    </g>
  </g>

  <!-- Footer Meta -->
  <g transform="translate(400, 515)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#484F58">
      Official Assessment Completed • Verified Competency Profile
    </text>
  </g>
</svg>
